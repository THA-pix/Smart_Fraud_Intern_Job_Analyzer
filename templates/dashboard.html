<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Dashboard | InternGuard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
:root {
    --primary: #22c55e;
    --primary-dark: #16a34a;
    --light-green: #ecfdf5;
}

/* BODY */
body {
    background: #ffffff;
    font-family: "Segoe UI", sans-serif;
}

/* SIDEBAR */
.sidebar {
    width: 260px;
    height: 100vh;
    background: linear-gradient(180deg, #22c55e, #16a34a);
    position: fixed;
    color: white;
}

.sidebar a {
    display: block;
    padding: 14px 22px;
    color: #fff;
    text-decoration: none;
}

.sidebar a.active,
.sidebar a:hover {
    background: rgba(255,255,255,0.2);
}

/* CONTENT */
.content {
    margin-left: 260px;
    padding: 40px;
}

/* HEADER */
.page-header {
    background: var(--light-green);
    border: 1px solid #bbf7d0;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 30px;
}

/* MAIN CARD */
.main-card {
    max-width: 650px;
    margin: auto;
    background: #ffffff;
    border-radius: 18px;
    padding: 25px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* INPUT SECTION (DASHED) */
.input-box {
    border: 2px dashed #22c55e;
    border-radius: 14px;
    padding: 20px;
    margin-top: 15px;
    background: #f9fffb;
}

/* INPUT */
.form-control, select {
    border-radius: 10px;
    padding: 10px;
}

/* BUTTONS */
.btn-main {
    background: linear-gradient(90deg, #22c55e, #16a34a);
    color: white;
    border: none;
    padding: 10px;
    border-radius: 10px;
    transition: 0.2s;
}

.btn-main:hover {
    opacity: 0.9;
}

.btn-warning {
    border-radius: 10px;
}

/* SELECT */
.select-box {
    border-radius: 10px;
    padding: 10px;
}

/* REMOVE LINK STYLE */
a {
    text-decoration: none !important;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar p-3">
    <h4 class="text-center mb-4">
        <i class="fa fa-shield-halved"></i> InternGuard
        <small class="d-block fs-6">User Panel</small>
    </h4>

    <a href="/dashboard" class="active">
        <i class="fa fa-home me-2"></i> Dashboard
    </a>
    <a href="/user_analytics">
        <i class="fa fa-chart-line me-2"></i> Analytics
    </a>

    <a href="/dashboard">
        <i class="fa fa-comment me-2"></i> Feedback
    </a>

    <hr>

    <a href="/logout" class="text-warning">
        <i class="fa fa-sign-out-alt me-2"></i> Logout
    </a>
</div>

<!-- MAIN -->
<div class="content">

    <!-- HEADER -->
    <div class="page-header">
        <h3><i class="fa fa-magnifying-glass"></i> Fraud Intern Detection</h3>
        <p>Analyze job postings using AI detection system.</p>
    </div>

    <!-- CARD -->
    <div class="main-card">

        <!-- TYPE SELECT -->
        <select id="type" class="form-control select-box mb-3" onchange="showForm()">
            <option value="image">📷 Image Upload</option>
            <option value="form">📝 Manual Input</option>
            <option value="url">🔗 URL Input</option>
        </select>

        <!-- IMAGE FORM -->
        <div id="imageForm" class="input-box">
            <form action="/predict" method="POST" enctype="multipart/form-data">
                <input type="hidden" name="type" value="image">

                <input name="job_title" class="form-control mb-2" placeholder="Job Title" required>
                <input name="company" class="form-control mb-2" placeholder="Company Name" required>

                <input type="file" name="file" class="form-control mb-3" required>

                <button class="btn btn-main w-100">Predict</button>
            </form>
        </div>

        <!-- URL FORM -->
        <div id="urlForm" class="input-box" style="display:none;">
            <form action="/predict" method="POST">
                <input type="hidden" name="type" value="url">

                <input name="job_title" class="form-control mb-2" placeholder="Job Title" required>
                <input name="company" class="form-control mb-2" placeholder="Company Name" required>

                <input name="url" class="form-control mb-3" placeholder="Enter Job URL" required>

                <button class="btn btn-warning w-100">Predict</button>
            </form>
        </div>

        <!-- MANUAL FORM -->
<div id="formInput" class="input-box" style="display:none;">
    <form action="/predict" method="POST">
        <input type="hidden" name="type" value="form">

        <input name="job_title" class="form-control mb-2" placeholder="Job Title" required>
        <input name="company" class="form-control mb-2" placeholder="Company Name" required>

        <textarea name="description" class="form-control mb-3" rows="5"
            placeholder="Enter full job description (salary, fees, details...)"></textarea>

        <button class="btn btn-main w-100">Analyze Description</button>
    </form>
</div>

    </div>

</div>

<script>
function showForm() {
    let type = document.getElementById("type").value;

    document.getElementById("imageForm").style.display = "none";
    document.getElementById("urlForm").style.display = "none";
    document.getElementById("formInput").style.display = "none";

    if(type === "image") document.getElementById("imageForm").style.display = "block";
    if(type === "url") document.getElementById("urlForm").style.display = "block";
    if(type === "form") document.getElementById("formInput").style.display = "block";
}
</script>

</body>
</html>
