<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Model Training | InternGuard Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
    --primary: #22c55e;
    --primary-dark: #16a34a;
    --light-green: #ecfdf5;
}

/* BODY */
body {
    background: #ffffff;
    font-family: "Segoe UI", sans-serif;
}

/* SIDEBAR */
.sidebar {
    width: 260px;
    height: 100vh;
    background: linear-gradient(180deg, #22c55e, #16a34a);
    position: fixed;
    color: white;
}

.sidebar a {
    display: block;
    padding: 14px 22px;
    color: #fff;
    text-decoration: none;
}

.sidebar a.active,
.sidebar a:hover {
    background: rgba(255,255,255,0.2);
}

/* CONTENT */
.content {
    margin-left: 260px;
    padding: 40px;
}

/* HEADER */
.page-header {
    background: var(--light-green);
    border: 1px solid #bbf7d0;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 30px;
}

/* CARD */
.main-card {
    background: #ffffff;
    border-radius: 18px;
    padding: 30px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* ACCURACY BOX */
.accuracy-box {
    background: linear-gradient(90deg, #22c55e, #16a34a);
    color: white;
    padding: 20px;
    border-radius: 14px;
    text-align: center;
    margin-bottom: 25px;
}

.accuracy-box h2 {
    margin: 0;
    font-weight: 700;
}

/* GRAPH CARD */
.graph-card {
    background: #ffffff;
    border-radius: 14px;
    padding: 15px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 6px 15px rgba(0,0,0,0.04);
}

/* CANVAS SIZE FIX */
canvas {
    width: 100% !important;
    height: 260px !important;
}

/* BUTTONS */
.btn-custom {
    background: linear-gradient(90deg, #22c55e, #16a34a);
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 10px;
    transition: 0.2s;
}

.btn-custom:hover {
    opacity: 0.9;
}

.btn-logout {
    background: #ef4444;
    color: white;
    border-radius: 10px;
    padding: 10px 22px;
}

/* REMOVE LINK STYLE */
a {
    text-decoration: none !important;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar p-3">
    <h4 class="text-center mb-4">
        <i class="fa fa-shield-halved"></i> InternGuard
        <small class="d-block fs-6">Admin Panel</small>
    </h4>

    <a href="/admin_dashboard">
        <i class="fa fa-gauge me-2"></i> Dashboard
    </a>

    <a href="/view_users">
        <i class="fa fa-users me-2"></i> Users
    </a>

    <a href="/process1" class="active">
        <i class="fa fa-brain me-2"></i> Train Model
    </a>

    <a href="/admin_analytics">
        <i class="fa fa-chart-line me-2"></i> Analytics
    </a>

    <a href="/view_feedback">
        <i class="fa fa-comments me-2"></i> Feedback
    </a>

    <hr>

    <a href="/admin_logout" class="text-warning">
        <i class="fa fa-sign-out-alt me-2"></i> Logout
    </a>
</div>

<!-- MAIN -->
<div class="content">

    <!-- HEADER -->
    <div class="page-header">
        <h3><i class="fa fa-robot"></i> Model Training Completed</h3>
        <p>Training results and performance visualization.</p>
    </div>

    <!-- MAIN CARD -->
    <div class="main-card">

        <!-- ACCURACY -->
        <div class="accuracy-box">
            <h2>🎯 Accuracy: {{ accuracy }}%</h2>
        </div>

        <!-- GRAPHS -->
        <div class="row g-4">

            <!-- Accuracy Graph -->
            <div class="col-md-6">
                <div class="graph-card">
                    <h6 class="text-center mb-2">Accuracy Graph</h6>
                    <canvas id="accuracyChart"></canvas>
                </div>
            </div>

            <!-- Loss Graph -->
            <div class="col-md-6">
                <div class="graph-card">
                    <h6 class="text-center mb-2">Loss Graph</h6>
                    <canvas id="lossChart"></canvas>
                </div>
            </div>

        </div>

        <!-- BUTTONS -->
        <div class="text-center mt-4">
            <a href="/admin_dashboard" class="btn btn-custom me-2">
                🏠 Dashboard
            </a>

            <a href="/admin_logout" class="btn btn-logout">
                Logout
            </a>
        </div>

    </div>

</div>

<script>
const epochs = {{ epochs|tojson }};
const trainAcc = {{ train_acc|tojson }};
const valAcc = {{ val_acc|tojson }};
const loss = {{ loss|tojson }};

// Accuracy Chart
new Chart(document.getElementById('accuracyChart'), {
    type: 'line',
    data: {
        labels: epochs,
        datasets: [
            {
                label: 'Training Accuracy',
                data: trainAcc,
                borderWidth: 2,
                tension: 0.4
            },
            {
                label: 'Validation Accuracy',
                data: valAcc,
                borderWidth: 2,
                tension: 0.4
            }
        ]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false
    }
});

// Loss Chart
new Chart(document.getElementById('lossChart'), {
    type: 'line',
    data: {
        labels: epochs,
        datasets: [
            {
                label: 'Loss',
                data: loss,
                borderWidth: 2,
                tension: 0.4
            }
        ]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false
    }
});
</script>

</body>
</html>
