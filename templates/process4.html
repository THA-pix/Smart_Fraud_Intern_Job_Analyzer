<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Feature Extraction | InternGuard Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
:root {
    --primary: #22c55e;
    --primary-dark: #16a34a;
    --light-green: #ecfdf5;
}

/* BODY */
body {
    background: #ffffff;
    font-family: "Segoe UI", sans-serif;
}

/* SIDEBAR */
.sidebar {
    width: 260px;
    height: 100vh;
    background: linear-gradient(180deg, #22c55e, #16a34a);
    position: fixed;
    color: white;
}

.sidebar a {
    display: block;
    padding: 14px 22px;
    color: #fff;
    text-decoration: none;
}

.sidebar a.active,
.sidebar a:hover {
    background: rgba(255,255,255,0.2);
}

/* CONTENT */
.content {
    margin-left: 260px;
    padding: 40px;
}

/* HEADER */
.page-header {
    background: var(--light-green);
    border: 1px solid #bbf7d0;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 30px;
}

/* CARD */
.table-card {
    background: #ffffff;
    border-radius: 18px;
    padding: 20px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* SCROLL AREA */
.table-wrapper {
    max-height: 450px;
    overflow: auto;
    border-radius: 12px;
}

/* =========================
   PANDAS TABLE STYLING
========================= */

/* APPLY TO ALL TABLES INSIDE */
.table-wrapper table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

/* HEADER */
.table-wrapper th {
    position: sticky;
    top: 0;
    z-index: 2;

    background: linear-gradient(90deg, #22c55e, #16a34a);
    color: white;

    padding: 8px;
    border: 1px solid #16a34a;
    white-space: nowrap;
}

/* CELLS */
.table-wrapper td {
    padding: 6px 8px;
    border: 1px solid #cbd5e1;
    white-space: nowrap;
}

/* ZEBRA */
.table-wrapper tr:nth-child(even) {
    background: #f9fafb;
}

/* HOVER */
.table-wrapper tr:hover {
    background: #ecfdf5;
}

/* BUTTONS */
.btn-custom {
    background: linear-gradient(90deg, #22c55e, #16a34a);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    transition: 0.2s;
}

.btn-custom:hover {
    opacity: 0.9;
}

.btn-back {
    background: #e5e7eb;
    color: #333;
    border-radius: 10px;
    padding: 10px 20px;
}

/* REMOVE LINK STYLE */
a {
    text-decoration: none !important;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar p-3">
    <h4 class="text-center mb-4">
        <i class="fa fa-shield-halved"></i> InternGuard
        <small class="d-block fs-6">Admin Panel</small>
    </h4>

    <a href="/admin_dashboard">
        <i class="fa fa-gauge me-2"></i> Dashboard
    </a>

    <a href="/view_users">
        <i class="fa fa-users me-2"></i> Users
    </a>

    <a href="/process1" class="active">
        <i class="fa fa-brain me-2"></i> Train Model
    </a>

    <a href="/admin_analytics">
        <i class="fa fa-chart-line me-2"></i> Analytics
    </a>

    <a href="/view_feedback">
        <i class="fa fa-comments me-2"></i> Feedback
    </a>

    <hr>

    <a href="/admin_logout" class="text-warning">
        <i class="fa fa-sign-out-alt me-2"></i> Logout
    </a>
</div>

<!-- MAIN -->
<div class="content">

    <!-- HEADER -->
    <div class="page-header">
        <h3><i class="fa fa-table"></i> Feature Extraction</h3>
        <p>View transformed dataset after preprocessing and feature extraction.</p>
    </div>

    <!-- CARD -->
    <div class="table-card">

        <div class="table-wrapper">
            {{ tables|safe }}
        </div>

        <!-- BUTTONS -->
        <div class="d-flex justify-content-between mt-4">
            <a href="/process2" class="btn btn-back">
                ⬅ Back
            </a>

            <a href="/process5" class="btn btn-custom">
                Next ➜ Process 5
            </a>
        </div>

    </div>

</div>

</body>
</html>
